seed: 42
n_outputs: 919       # DeepSEA chromatin features

model:
  type: lstm
  input_dim: 4
  proj_dim: 128
  hidden_size: 256
  num_layers: 2
  bidirectional: true
  dropout: 0.3
  pooling: mean

training:
  optimizer: adamw       # NaN-guarded AdamW (SafeAdamW); == torch AdamW when grads are finite
  batch_size: 128
  epochs: 15
  lr: 0.0005
  weight_decay: 0.00001
  gradient_clip: 1.0   # gradient clipping applied every step
  use_amp: true
  use_pos_weight: false
  reverse_complement_augmentation: true
  num_workers: 4
