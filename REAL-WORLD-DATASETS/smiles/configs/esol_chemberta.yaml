name: esol_chemberta
task:
  name: esol
  type: regression
  n_tasks: 1
data:
  dataset: esol
  splitter: scaffold
  cache_dir: data
  max_length: 256
model:
  type: chemberta
  pretrained: DeepChem/ChemBERTa-77M-MTR
  dropout: 0.1
train:
  epochs: 40
  batch_size: 32
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: linear
  grad_clip: 1.0
  patience: 8
seeds: [0, 1, 2]
output:
  results_dir: results
  ckpt_dir: checkpoints
